name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual triggers

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Create .env.production on server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            cd ${{ secrets.DEPLOY_PATH }}
            cat > .env.production << 'ENVEOF'
          APP_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          APP_DOMAIN=${{ secrets.APP_DOMAIN }}
          APP_URL=${{ secrets.APP_URL }}
          ELECTRIC_DOMAIN=${{ secrets.ELECTRIC_DOMAIN }}
          ELECTRIC_INSECURE=false
          ELECTRIC_AUTH_MODE=secure
          ELECTRIC_SECRET=${{ secrets.ELECTRIC_SECRET }}
          BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
          ACME_EMAIL=${{ secrets.ACME_EMAIL }}
          ENVEOF
          ENDSSH

      - name: Deploy to DigitalOcean
        env:
          IMAGE_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "📦 Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            echo "🔐 Logging into GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "� Loading environment variables..."
            set -a
            source .env.production
            set +a

            echo "🔨 Pulling and deploying services..."
            docker compose -f docker-compose.prod.yaml pull
            docker compose -f docker-compose.prod.yaml up -d

            echo "⏳ Waiting for services to be healthy..."
            sleep 15

            echo "🗄️ Running migrations..."
            docker compose -f docker-compose.prod.yaml exec -T app sh -c "cd /app && node_modules/.bin/drizzle-kit migrate" || echo "⚠️ Migrations may have already been applied"

            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "✅ Deployment complete!"
            docker compose -f docker-compose.prod.yaml ps
          ENDSSH

      - name: Notify on failure
        if: failure()
        run: echo "❌ Deployment failed! Check the logs above for details."

      - name: Notify on success
        if: success()
        run: echo "✅ Successfully deployed to ${{ secrets.APP_URL }}"
