name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual triggers

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Create .env.production on server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ${{ secrets.DEPLOY_PATH }}
            cat > .env.production << 'ENVEOF'
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          APP_DOMAIN=${{ secrets.APP_DOMAIN }}
          APP_URL=${{ secrets.APP_URL }}
          ELECTRIC_DOMAIN=${{ secrets.ELECTRIC_DOMAIN }}
          ELECTRIC_INSECURE=false
          ELECTRIC_AUTH_MODE=secure
          BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
          ACME_EMAIL=${{ secrets.ACME_EMAIL }}
          ENVEOF
          EOF

      - name: Deploy to DigitalOcean
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "📦 Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            echo "🔨 Building and deploying..."
            docker compose -f docker-compose.prod.yaml pull postgres electric caddy
            docker compose -f docker-compose.prod.yaml build app
            docker compose -f docker-compose.prod.yaml up -d

            echo "⏳ Waiting for services to be healthy..."
            sleep 15

            echo "🗄️ Running migrations..."
            docker compose -f docker-compose.prod.yaml exec -T app sh -c "cd /app && node_modules/.bin/drizzle-kit migrate" || echo "⚠️ Migrations may have already been applied"

            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "✅ Deployment complete!"
            docker compose -f docker-compose.prod.yaml ps
          EOF

      - name: Notify on failure
        if: failure()
        run: echo "❌ Deployment failed! Check the logs above for details."

      - name: Notify on success
        if: success()
        run: echo "✅ Successfully deployed to ${{ secrets.APP_URL }}"
